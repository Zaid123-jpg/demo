<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body{
             background: #000;
        }
        form ::placeholder{
            color: darkblue;
            background: #fff;
        }
        form input{
            color: darkblue;
            background: #fff;
        }
        form input:hover{
            transform: translateY(-8px);
            transition: 0.6s ease-in;
            font-size: x-large;
            font-weight: 900;
        }
        select{
            text-align: center;
            display: 1;
        }
    </style>
  </head>
  <body>
    <div class="container">
    <h1 class="text-center display-1" style="color: #fff;">registration page</h1>
    <hr>

    <form>
        <input type="text" class="form-control" placeholder="enter name">
        <input type="text" class="form-control" placeholder="enter last name">
        <input type="password" class="form-control" placeholder="enter password">
        <input type="password" class="form-control" placeholder="enter last password">
        <input type="email" class="form-control" placeholder="enter a email">
        <input type="number" class="form-control" placeholder="enter age">
        <select>
            <option value="1">pakistan</option>
            <option value="2">karachi</option>
            <option value="3">gatia india</option>
            <option value="4">afghanistan</option>
        </select>

        
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
